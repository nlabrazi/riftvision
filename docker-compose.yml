services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: riftvision-app
    restart: unless-stopped
    # Docker Engine dans WSL2 en mode mirrored : accès au localhost Windows.
    # Nuxt écoute directement sur le port 3000 du réseau hôte.
    network_mode: host
    environment:
      LIVE_CLIENT_BASE_URL: "${LIVE_CLIENT_BASE_URL:-https://127.0.0.1:2999}"
      NODE_ENV: development
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - nuxt_dev:/app/.nuxt
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  node_modules:
  nuxt_dev:
