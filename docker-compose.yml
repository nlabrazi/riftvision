version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: riftvision-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Base URL de l'API Live Client (Windows Host)
      LIVE_CLIENT_BASE_URL: "${LIVE_CLIENT_BASE_URL:-https://host.docker.internal:2999}"
      NODE_ENV: development
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    extra_hosts:
      # Fait pointer host.docker.internal vers l'IP réelle de la machine Windows hôte (WSL gateway)
      - "host.docker.internal:${WINDOWS_HOST_IP:-172.25.128.1}"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  node_modules:
